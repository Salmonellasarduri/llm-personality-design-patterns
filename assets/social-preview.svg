<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">人格プロンプトの先へ</title>
  <desc id="desc">4か月以上の運用から抽出した、経験で変わりながら核心を保つLLMエージェントの設計フロー。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .jp { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
      .title { fill: #f8fafc; font-size: 58px; font-weight: 800; letter-spacing: 0.02em; }
      .subtitle { fill: #cbd5e1; font-size: 26px; font-weight: 500; }
      .chip { fill: #0c4a6e; stroke: #38bdf8; stroke-width: 1.5; }
      .chip-text { fill: #e0f2fe; font-size: 20px; font-weight: 700; }
      .box { fill: #17233a; stroke: #47617f; stroke-width: 2; }
      .box-accent { fill: #17233a; stroke: #fbbf24; stroke-width: 3; }
      .box-title { fill: #f8fafc; font-size: 23px; font-weight: 700; }
      .box-note { fill: #aebed2; font-size: 17px; font-weight: 500; }
      .core { fill: #fbbf24; font-size: 17px; font-weight: 800; }
      .arrow { fill: none; stroke: #7dd3fc; stroke-width: 3; marker-end: url(#arrow); }
      .footer { fill: #94a3b8; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
      .version { fill: #38bdf8; font-size: 20px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1180" cy="42" r="210" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="90" cy="610" r="180" fill="#fbbf24" opacity="0.035"/>

  <text class="jp title" x="72" y="105">人格プロンプトの先へ</text>
  <text class="jp subtitle" x="74" y="151">経験で変わりながら、核心を失わないLLMエージェント</text>

  <rect class="chip" x="956" y="72" width="252" height="52" rx="26"/>
  <text class="jp chip-text" x="1082" y="105" text-anchor="middle">4か月以上の継続運用</text>

  <path class="arrow" d="M303 358 H352"/>
  <path class="arrow" d="M593 358 H642"/>
  <path class="arrow" d="M883 358 H932"/>

  <g filter="url(#shadow)">
    <rect class="box" x="62" y="288" width="241" height="140" rx="18"/>
    <text class="jp box-title" x="182.5" y="340" text-anchor="middle">経験を取り込む</text>
    <text class="jp box-note" x="182.5" y="380" text-anchor="middle">誰の経験か確認する</text>

    <rect class="box-accent" x="352" y="288" width="241" height="140" rx="18"/>
    <text class="jp core" x="472.5" y="272" text-anchor="middle">変更できない核心で保護</text>
    <text class="jp box-title" x="472.5" y="340" text-anchor="middle">自己物語を更新</text>
    <text class="jp box-note" x="472.5" y="380" text-anchor="middle">一時の感情は固定しない</text>

    <rect class="box" x="642" y="288" width="241" height="140" rx="18"/>
    <text class="jp box-title" x="762.5" y="340" text-anchor="middle">実際に話させる</text>
    <text class="jp box-note" x="762.5" y="380" text-anchor="middle">問題があれば変更を棄却</text>

    <rect class="box" x="932" y="288" width="286" height="140" rx="18"/>
    <text class="jp box-title" x="1075" y="340" text-anchor="middle">応答に使う</text>
    <text class="jp box-note" x="1075" y="376" text-anchor="middle">事実は認める</text>
    <text class="jp box-note" x="1075" y="402" text-anchor="middle">自己否定へは流れない</text>
  </g>

  <text class="jp footer" x="72" y="579">LLM Personality Design Patterns</text>
  <text class="jp version" x="1208" y="579" text-anchor="end">v0.2.0</text>
</svg>
