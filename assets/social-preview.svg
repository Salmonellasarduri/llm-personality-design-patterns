<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">人格プロンプトの先へ</title>
  <desc id="desc">守る核心、経験で変わる自己物語、その場かぎりの一時状態を分けるLLMエージェントの設計。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .jp { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
      .title { fill: #f8fafc; font-size: 58px; font-weight: 800; letter-spacing: 0.02em; }
      .subtitle { fill: #cbd5e1; font-size: 25px; font-weight: 500; }
      .chip { fill: #0c4a6e; stroke: #38bdf8; stroke-width: 1.5; }
      .chip-text { fill: #e0f2fe; font-size: 20px; font-weight: 700; }
      .box { fill: #17233a; stroke: #47617f; stroke-width: 2; }
      .box-core { fill: #29251e; stroke: #fbbf24; stroke-width: 2.5; }
      .box-story { fill: #102d40; stroke: #38bdf8; stroke-width: 3; }
      .box-title { fill: #f8fafc; font-size: 24px; font-weight: 800; }
      .box-note { fill: #aebed2; font-size: 17px; font-weight: 600; }
      .label { fill: #cbd5e1; font-size: 16px; font-weight: 700; }
      .line { fill: none; stroke: #7588a3; stroke-width: 2.5; }
      .line-dashed { fill: none; stroke: #7588a3; stroke-width: 2.5; stroke-dasharray: 7 7; }
      .arrow { fill: none; stroke: #7dd3fc; stroke-width: 3; marker-end: url(#arrow); }
      .footer { fill: #94a3b8; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
      .version { fill: #38bdf8; font-size: 20px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1180" cy="42" r="210" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="90" cy="610" r="180" fill="#fbbf24" opacity="0.035"/>

  <text class="jp title" x="72" y="108">人格プロンプトの先へ</text>
  <text class="jp subtitle" x="74" y="158">変えない核心と、経験で変わる自己物語を分ける</text>
  <text class="jp subtitle" x="74" y="196">LLMエージェントの設計パターン</text>

  <rect class="chip" x="72" y="246" width="252" height="52" rx="26"/>
  <text class="jp chip-text" x="198" y="279" text-anchor="middle">4か月以上の継続運用</text>

  <g filter="url(#shadow)">
    <rect class="box-core" x="825" y="72" width="310" height="92" rx="17"/>
    <text class="jp box-title" x="980" y="112" text-anchor="middle">守る核心</text>
    <text class="jp box-note" x="980" y="141" text-anchor="middle">変えない</text>

    <rect class="box" x="560" y="274" width="190" height="104" rx="17"/>
    <text class="jp box-title" x="655" y="319" text-anchor="middle">経験</text>
    <text class="jp box-note" x="655" y="349" text-anchor="middle">更新の材料</text>

    <rect class="box-story" x="825" y="260" width="310" height="132" rx="19"/>
    <text class="jp box-title" x="980" y="316" text-anchor="middle">自己物語</text>
    <text class="jp box-note" x="980" y="351" text-anchor="middle">経験で変わる</text>

    <rect class="box" x="825" y="488" width="310" height="92" rx="17"/>
    <text class="jp box-title" x="980" y="528" text-anchor="middle">一時状態</text>
    <text class="jp box-note" x="980" y="557" text-anchor="middle">その場かぎり</text>
  </g>

  <path class="line" d="M980 164 V260"/>
  <rect x="865" y="190" width="230" height="27" rx="13" fill="#101a2d"/>
  <text class="jp label" x="980" y="209" text-anchor="middle">変えてよい範囲を決める</text>

  <path class="arrow" d="M750 326 H825"/>
  <text class="jp label" x="787" y="298" text-anchor="middle">検証して採用</text>

  <path class="line-dashed" d="M980 392 V488"/>
  <rect x="891" y="421" width="178" height="27" rx="13" fill="#101a2d"/>
  <text class="jp label" x="980" y="440" text-anchor="middle">人格には残さない</text>

  <text class="jp footer" x="72" y="579">LLM Personality Design Patterns</text>
  <text class="jp version" x="1208" y="579" text-anchor="end">v0.2.0</text>
</svg>
